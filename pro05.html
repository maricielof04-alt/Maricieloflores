<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 05</title>
</head>
<body>
    <h1>5. Descuento en una tienda</h1>
    <a href="index.html">Volver al inicio</a>

    <script>
        let precio = parseFloat(prompt("Ingrese el precio del producto:"));
        let descuento = precio * 0.15;
        let precioFinal = precio - descuento;

        alert("Monto del descuento (15%): S/ " + descuento.toFixed(2) + 
              "\nPrecio final a pagar: S/ " + precioFinal.toFixed(2));
    </script>
</body>
</html>
